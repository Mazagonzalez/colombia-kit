name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Versionar o publicar
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Con cambios pendientes abre el PR "Version Packages"; sin ellos, publica lo que falte en npm.
      # BOT_TOKEN hace que ese PR dispare el CI, cosa que GITHUB_TOKEN no permite.
      # npm no necesita token: autoriza este workflow por su nombre (trusted publishing), con
      # id-token: write. Si se renombra el archivo, hay que actualizarlo en cada paquete de npm.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: |
            chore: versionar paquetes

            Co-Authored-By: Claude <noreply@anthropic.com>
          pr-title: 'chore: versionar paquetes'
          github-token: ${{ secrets.BOT_TOKEN || github.token }}
