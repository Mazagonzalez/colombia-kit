name: Actualizar DIVIPOLA

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: actualizar-divipola
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actualizar:
    name: Comparar con la fuente del DANE
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: actualizar
        run: pnpm divipola:actualizar
        env:
          DIVIPOLA_SALIDA: ${{ runner.temp }}

      # BOT_TOKEN hace que el PR dispare el CI, cosa que GITHUB_TOKEN no permite.
      - if: ${{ steps.actualizar.outputs.cambios == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          branch: chore/actualizar-divipola
          delete-branch: true
          title: 'chore(divipola): actualizar datos desde el DANE'
          commit-message: |
            chore(divipola): actualizar datos desde el DANE

            Co-Authored-By: Claude <noreply@anthropic.com>
          body-path: ${{ runner.temp }}/divipola-resumen.md
          add-paths: |
            data/divipola.json
            packages/divipola/src/generated/**
            php/resources/data/divipola.json
            .changeset/actualizar-divipola-*.md

      # Un solo issue abierto por problema: las ejecuciones siguientes comentan en él.
      - if: ${{ failure() && steps.actualizar.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARCHIVO_ERROR: ${{ runner.temp }}/divipola-error.md
          TITULO: 'La actualización automática de DIVIPOLA falló'
        run: |
          {
            echo "La fuente del DANE falló o cambió de formato, así que no se tocó ningún dato."
            echo
            echo '```text'
            cat "$ARCHIVO_ERROR" 2>/dev/null || echo "El script terminó sin dejar un mensaje de error."
            echo '```'
            echo
            echo "Ejecución: $EJECUCION"
          } > cuerpo.md

          existente=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body-file cuerpo.md
          else
            gh issue create --title "$TITULO" --body-file cuerpo.md
          fi
